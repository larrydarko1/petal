# Releasing is driven by package.json, not by pushing a tag by hand: land a `bump: version x.y.z`
# commit on main, and once CI goes green this workflow tags it, builds the installers and publishes
# the release.
# The idempotency check keys on a *published* release, not on the tag: the tag is created before the
# builds run, so keying on the tag would make every failed run unresumable — a re-run would find the
# tag, decide there was nothing to do, and quietly skip.
#
# It hangs off `workflow_run` rather than `push` so a red CI can never produce a release.

name: Release

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # ── Read version and decide whether there is anything to release ──
    version:
        name: Resolve version
        if: >
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_repository.full_name == github.repository
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            version: ${{ steps.pkg.outputs.version }}
            tag: ${{ steps.pkg.outputs.tag }}
            exists: ${{ steps.check.outputs.exists }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false

            - name: Read version from package.json
              id: pkg
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Version: $VERSION"

            - name: Check if release already published
              id: check
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ steps.pkg.outputs.tag }}
              run: |
                  DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo "missing")
                  if [ "$DRAFT" = "false" ]; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                      echo "Release $TAG is already published, skipping"
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                      echo "No published release for $TAG (state: $DRAFT), will release"
                  fi

    # ── Tag the commit and open a draft release for the builds to upload into ──
    prepare:
        name: Tag and open draft
        needs: version
        if: needs.version.outputs.exists == 'false'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            # This job pushes the tag, so it is the one checkout that keeps its credentials.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            # A retry of a failed release re-enters this job with the tag already pushed.
            - name: Create tag
              env:
                  TAG: ${{ needs.version.outputs.tag }}
              run: |
                  if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
                      echo "Tag $TAG already exists, reusing it"
                      exit 0
                  fi
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"
                  git tag -a "$TAG" -m "Release $TAG"
                  git push origin "$TAG"

            - name: Create draft release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  tag_name: ${{ needs.version.outputs.tag }}
                  name: Petal ${{ needs.version.outputs.tag }}
                  draft: true
                  prerelease: false
                  generate_release_notes: true
                  body: |
                      ## Petal does not update itself

                      Nothing phones home and nothing installs behind your back — which also means Petal
                      will never tell you a new version exists. To upgrade, download from this page and
                      replace your copy. Watch this repository if you want to hear about new releases.

                      ## Installing

                      Petal ships prebuilt binaries for **Linux only**. These builds are not signed, so
                      your desktop environment may warn you the first time you open the app.

                      - **AppImage** — `chmod +x` the file, then run it.
                      - **deb / rpm** — install with your package manager.
                      - **tar.gz** — extract anywhere and run the `petal` binary inside. It links against
                        the system WebKitGTK, so install `libwebkit2gtk-4.1` first; the deb and rpm pull it
                        in for you.

                      Opening a `.txt` file with Petal works once the app is installed; the deb and rpm
                      packages register the file association, the AppImage and tar.gz do not.

                      ## Other platforms

                      Petal is MIT licensed and the source still builds on macOS and Windows — there is just
                      no prebuilt download, because unsigned binaries get warned about or blocked by the OS
                      and signing needs paid certificates. To run it there, install the
                      [Tauri prerequisites](https://v2.tauri.app/start/prerequisites/) and build it yourself:

                      ```sh
                      git clone https://github.com/larrydarko1/petal.git
                      cd petal && npm ci
                      npm run tauri:build:mac   # macOS
                      npm run tauri:build:win   # Windows
                      ```

                      The result lands in `src-tauri/target/`. It is untested by the maintainer — bug reports
                      from self-built platforms are welcome but are fixed on a best-effort basis.

    # ── Installers ────────────────────────────────────────
    # Linux is the only platform this project distributes binaries for. macOS and Windows builds were
    # dropped deliberately: without paid signing certificates the downloads were blocked or warned
    # about often enough to be a worse experience than no download. Their build scripts stay in
    # package.json for self-builds — they are just not something CI publishes.
    build:
        name: Build Linux packages
        needs: [version, prepare]
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false

            - uses: ./.github/actions/node-setup

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-15
              with:
                  toolchain: stable

            # What the Rust crates compile against on Linux: https://v2.tauri.app/start/prerequisites/
            # patchelf is for the AppImage bundler.
            - name: Install Linux system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

            - name: Build installers
              run: npm run tauri:build:linux

            # Tauri has no tarball bundler, so this packs the same binary the deb and rpm install.
            - name: Pack tarball
              env:
                  VERSION: ${{ needs.version.outputs.version }}
              run: |
                  set -euo pipefail
                  NAME="Petal_${VERSION}_amd64"
                  OUT=src-tauri/target/release/bundle/tar
                  mkdir -p "$OUT/$NAME"
                  cp src-tauri/target/release/petal LICENSE "$OUT/$NAME/"
                  tar -czf "$OUT/$NAME.tar.gz" -C "$OUT" "$NAME"

            - name: Upload to draft release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ needs.version.outputs.tag }}
                  ASSETS: >-
                      src-tauri/target/release/bundle/appimage/*.AppImage
                      src-tauri/target/release/bundle/deb/*.deb
                      src-tauri/target/release/bundle/rpm/*.rpm
                      src-tauri/target/release/bundle/tar/*.tar.gz
              run: |
                  set -euo pipefail
                  # shellcheck disable=SC2086
                  ls -lh $ASSETS
                  # shellcheck disable=SC2086
                  gh release upload "$TAG" $ASSETS --clobber

    # ── Publish ────────────────────────────────────────────
    publish:
        name: Publish release
        needs: [version, build]
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - name: Flip draft to published
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ needs.version.outputs.tag }}
              run: gh release edit "$TAG" --draft=false
