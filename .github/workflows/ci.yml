# The gate for everything that reaches `main`. The step list is the same list `npm run ci:check`
# runs locally, as separate steps so a failure names itself in the job summary.

name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: Lint, type-check, test, build
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/node-setup

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Stylelint
              run: npm run stylelint

            - name: Type check
              run: npm run typecheck

            - name: Tests (with 80% coverage enforcement)
              run: npm run test:coverage

            # The testing gate reads the coverage summary the step above wrote.
            - name: larry check
              run: npm run check

            # The webview alone; `generate_context!` also needs dist/ to exist before Rust compiles.
            - name: Build (webview)
              run: npx vite build

            # What the Rust crates compile against on Linux: https://v2.tauri.app/start/prerequisites/
            - name: Install WebKitGTK
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-15
              with:
                  toolchain: stable
                  components: clippy, rustfmt

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: src-tauri

            - name: Rust format check
              run: npm run rust:fmt

            - name: Clippy
              run: npm run rust:lint

            - name: Rust tests
              run: npm run rust:test
