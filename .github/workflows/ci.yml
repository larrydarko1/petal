# The gate for everything that reaches `main`. The step list is the same list `npm run ci:check`
# runs locally, as separate steps so a failure names itself in the job summary.

name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: Lint, type-check, test, build
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
              with:
                  persist-credentials: false

            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - name: Audit
              run: npm run audit:check

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: package.json
              run: npm run pkg:check

            - name: Pipeline
              run: npm run pipeline:check

            - name: Type check
              run: npm run typecheck

            - name: Dead code
              run: npm run dead:check

            - name: tsconfigs
              run: npm run tsconfig:check

            - name: Tests (with 80% coverage enforcement)
              run: npm run test:coverage

            # The webview alone; `generate_context!` also needs dist/ to exist before Rust compiles.
            - name: Build (webview)
              run: npx vite build

            # What the Rust crates compile against on Linux: https://v2.tauri.app/start/prerequisites/
            - name: Install WebKitGTK
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable as of 2026-02-13
              with:
                  toolchain: stable
                  components: clippy, rustfmt

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: src-tauri

            - name: Rust format check
              run: npm run rust:fmt

            - name: Clippy
              run: npm run rust:lint

            - name: Rust tests
              run: npm run rust:test
