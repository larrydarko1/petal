[package]
name = "petal"
version = "1.0.0"
description = "A minimal text editor"
authors = ["Lorenzo Mazzola"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "petal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = { version = "0.4", features = ["kv"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
allow_attributes_without_reason = "deny"
# An exception is `#[expect(lint, reason = "…")]`, which fails once the lint stops firing,
# so a suppression cannot outlive the code it was for.
allow_attributes = "deny"
# `commands.rs` beside `commands/`, the layout the Rust Book teaches, not `commands/mod.rs`.
mod_module_files = "deny"
# A command receives `State` and its arguments by value: that is how Tauri hands them over.
needless_pass_by_value = "allow"
