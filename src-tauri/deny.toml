# cargo-deny: what the Rust side may depend on. `npm run rust:deny` runs every check below.
#
# Petal ships under the MIT License, so the licence list holds only what an MIT app may ship in its
# binary without changing its terms. A crate under anything else fails the build, so it is found the
# day it is added, not after a release has shipped it.

[graph]
# Linux is released; the README tells people how to build the other two. A dependency that only one
# of these four targets pulls in still counts.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive: each needs only its notice kept.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # File-level copyleft: the MPL files themselves ship with their source, and the rest of the app
    # keeps its own licence. Tauri itself needs it (cssparser, selectors).
    "MPL-2.0",
]
# Never added to `allow`: any GPL, LGPL or AGPL (they would put the whole binary under their terms),
# SSPL, BUSL, the Commons Clause, and anything non-commercial.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[advisories]
version = 2
# RustSec: a crate with a published vulnerability, or one marked unmaintained, fails the build.
# A waiver goes in `ignore` as { id, reason }, with the same two halves as the npm audit gate's:
# why it cannot be fixed here, and why it is unreachable in Petal. cargo-deny has no expiry field,
# so the review date is written into the reason and checked by hand.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained, not vulnerable. It reaches the tree only on Linux, through Tauri's GTK3 bindings (glib-macros 0.18), which Tauri 2 pins, so it cannot be replaced from here. It is a proc macro: it runs at compile time and none of its code is in the shipped binary. Review by 2027-05-06, or when Tauri moves off GTK3." },
]

[bans]
# Two versions of one crate is normal in a Tauri tree and not worth failing on.
multiple-versions = "allow"
wildcards = "deny"

[sources]
# crates.io only: a git dependency is code nobody published or reviewed as a release.
unknown-registry = "deny"
unknown-git = "deny"
